<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="shieldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#1B2F4A" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon: Geometric Shield & Industrial Setu Bridge -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#shieldGradLight)" stroke="#059669" stroke-width="1.5" />
    <!-- Arch Bridge -->
    <path d="M8 29 C13 17, 27 17, 32 29" stroke="#10B981" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <!-- Vertical Pillars -->
    <path d="M14 29 V20 M20 29 V14 M26 29 V20" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
    <!-- Central Node -->
    <circle cx="20" cy="11" r="3.2" fill="#F0FDF4" />
    <circle cx="20" cy="11" r="1.6" fill="#00875A" />
  </g>

  <!-- Brand Typography (For Light Backgrounds) -->
  <text x="54" y="27" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#0B192C" letter-spacing="-0.4">
    Anumati<tspan fill="#00875A">Setu</tspan>
  </text>
  
  <text x="55" y="40" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1.2">
    INDUSTRIAL CLEARANCES
  </text>
</svg>
